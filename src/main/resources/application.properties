server.port=${PORT:8080}
spring.application.name=api-gateway
management.endpoints.web.exposure.include=health,info
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://eureka-server.apps.internal:8080/eureka}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${spring.application.name}.apps.internal}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=${server.port}
demo.timezone=America/Chicago
gateway.services=customer-service,quote-service,underwriting-service,policy-service,claims-service,payment-service
spring.cloud.gateway.routes[0].id=customer-service
spring.cloud.gateway.routes[0].uri=lb://customer-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/customers/**
spring.cloud.gateway.routes[1].id=quote-service
spring.cloud.gateway.routes[1].uri=lb://quote-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/quotes/**
spring.cloud.gateway.routes[2].id=underwriting-service
spring.cloud.gateway.routes[2].uri=lb://underwriting-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/underwriting/**
spring.cloud.gateway.routes[3].id=policy-service
spring.cloud.gateway.routes[3].uri=lb://policy-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/policies/**
spring.cloud.gateway.routes[4].id=claims-service
spring.cloud.gateway.routes[4].uri=lb://claims-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/claims/**
spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=lb://payment-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/payments/**
